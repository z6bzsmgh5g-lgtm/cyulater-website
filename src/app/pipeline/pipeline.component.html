@let t = i18n.t().pipeline;
<figure class="pipeline__figure">
  <svg [attr.viewBox]="viewBox()" role="group" [attr.aria-label]="t.label" class="pipeline__svg" [class.is-vertical]="vertical()" (mouseleave)="preview(null)">
    <defs>
      <linearGradient id="pl-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8a2be2" /><stop offset="1" stop-color="#d6507a" />
      </linearGradient>
    </defs>
    @for (c of columnTitles(); track $index) {
      <text class="pl-col" [attr.x]="c.x" [attr.y]="c.y" text-anchor="middle">{{ c.text }}</text>
    }
    @for (e of edges(); track e.from + e.to) {
      <path class="pl-edge" [class.is-dim]="!isLit(e)" [attr.d]="e.d" [attr.id]="'pl-' + e.from + '-' + e.to" />
    }
    @if (!reducedMotion()) {
      @for (e of edges(); track e.from + e.to; let i = $index) {
        <circle class="pl-packet" [class.is-dim]="!isLit(e)" r="3.5">
          <animateMotion [attr.dur]="(2.6 + (i % 3) * 0.4) + 's'" repeatCount="indefinite" [attr.begin]="(i * 0.45) + 's'" [attr.path]="e.d" />
        </circle>
      }
    }
    @for (n of boxes(); track n.id) {
      <g class="pl-node" [class.pl-node--core]="n.kind === 'core'" [class.is-active]="active() === n.id"
         tabindex="0" role="button" [attr.aria-pressed]="pinned() === n.id" [attr.aria-label]="label(n.id)"
         (click)="select(n.id)" (keydown)="onKey($event, n.id)" (mouseenter)="preview(n.id)">
        <rect [attr.x]="n.x" [attr.y]="n.y" [attr.width]="n.w" [attr.height]="n.h" [attr.rx]="n.kind === 'core' ? 14 : 10" />
        <text [attr.x]="n.x + n.w / 2" [attr.y]="n.y + n.h / 2 + 5" text-anchor="middle">{{ label(n.id) }}</text>
      </g>
    }
  </svg>
  <figcaption class="pipeline__caption" aria-live="polite">
    @if (caption(); as c) { <strong>{{ c.title }}</strong> <span>{{ c.text }}</span> }
    @else { <span class="pipeline__hint">{{ t.hint }}</span> }
  </figcaption>
</figure>
